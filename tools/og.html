<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>OG Cumil (sementara)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Halaman sementara untuk membuat og-image.jpg (1200×630) dan icon.png (512×512).
     Dipotret oleh tools/make-og.mjs — tidak ikut dipakai di web. */
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Baloo 2",system-ui,sans-serif;color:#5A2A0C}
  .og{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#FFF4E8 0%,#FDE9D6 50%,#FBE2C6 100%);
    display:grid;grid-template-columns:330px 470px 400px;align-items:center
  }
  /* titik-titik lembut di latar */
  .og::before{content:"";position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(#F4A6B7 2.5px,transparent 3px),radial-gradient(#F2A03D 2.5px,transparent 3px);
    background-size:64px 64px,64px 64px;background-position:0 0,32px 32px;
    -webkit-mask-image:linear-gradient(90deg,#000 0%,transparent 35%,transparent 65%,#000 100%);mask-image:linear-gradient(90deg,#000 0%,transparent 35%,transparent 65%,#000 100%)}
  .kiri{position:relative;display:flex;flex-direction:column;align-items:center;padding-left:40px}
  .kiri img{width:280px;filter:drop-shadow(0 8px 0 rgba(90,42,12,.15))}
  .kiri .sub{margin-top:6px;font-weight:800;font-size:28px}
  .tengah{position:relative;padding-left:24px}
  h1{margin:0 0 22px;font-size:62px;line-height:.98;font-weight:800;letter-spacing:-.5px}
  h1 em{font-style:normal;color:#E4568A}
  h1 b{color:#E07F12}
  .pill{display:inline-flex;align-items:center;gap:10px;border:4px solid #5A2A0C;border-radius:999px;padding:6px 22px 4px;
    font-weight:800;font-size:28px;background:#fff;box-shadow:0 6px 0 rgba(90,42,12,.2);margin:0 0 14px;white-space:nowrap}
  .pill.harga{background:linear-gradient(135deg,#F4A6B7,#F2A03D)}
  .pill.wa{background:#128C4A;color:#fff;border-color:#0B6B37;box-shadow:0 6px 0 #0B6B37}
  .kanan{position:relative;height:630px;display:flex;align-items:center;justify-content:center}
  .kanan .blob{position:absolute;width:390px;height:390px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 70%)}
  .kanan canvas{position:relative;width:430px;height:auto;margin-right:24px}

  .icon{width:512px;height:512px;background:#FFF3DF;display:flex;align-items:center;justify-content:center}
  .icon img{width:440px}
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="kiri"><img src="logo.webp" alt=""><div class="sub">Custom Cemilan</div></div>
    <div class="tengah">
      <h1>Racik camilan <em>manis</em> &amp; <b>gurih</b>mu sendiri!</h1>
      <div class="pill harga">Paket 500 g · Rp20.000</div><br>
      <div class="pill wa">Pre-order via WhatsApp</div>
    </div>
    <div class="kanan"><div class="blob"></div><canvas id="box"></canvas></div>
  </div>
  <div class="icon" id="icon"><img src="logo.webp" alt=""></div>
<script>
  // potong area transparan di sekeliling kotak 3D (bayangan ikut agar tepinya memudar alami), lalu tampilkan
  window.ogReady = new Promise((selesai) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] > 2) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      const pad = 4, out = document.getElementById("box");
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width, x1 + pad); y1 = Math.min(c.height, y1 + pad);
      out.width = x1 - x0; out.height = y1 - y0;
      out.getContext("2d").drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
      selesai();
    };
    img.src = "build/box.png";
  });
</script>
</body>
</html>
